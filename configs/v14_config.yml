# car_config.py 설정값 모음
# 사용법:
#   python car_config.py           # DEFAULT 사용
#   python car_config.py ODIM      # ODIM 프로파일 오버라이드 적용
#   python car_config.py odil      # 대소문자 무관

# =============================================================================
# DEFAULT 설정 (파라미터 미지정 시 사용)
# =============================================================================
default:

  # Task 활성화
  ENABLED:
    edit_initial_setup: true
    check_connectivity: true
    install_logrotate:  true
    check_nic:          true
    run_lidar_config:   false  # lidar_config 파일이 지정된 프로파일에서만 true로 설정

  # Task 1: initial_setup.sh 편집
  INITIAL_SETUP_FILE: /home/odin/initial_setup.sh
  CAN_CMD_TEMPLATE: >-
    ip link set {iface} up type can bitrate 500000 sjw 3 sample-point 0.8
    berr-reporting on restart-ms 100

  # Task 2: IP 연결 확인
  PING_TARGETS:
    - 192.168.31.6
    - 192.168.31.7
    - 192.168.31.8
    - 192.168.0.6
    - 192.168.0.7
    - 192.168.0.8
  PING_COUNT:   3
  PING_TIMEOUT: 2

  # (NIC 이름, IP 주소) 쌍
  # IP를 빈 문자열로 두면 인터페이스 UP 여부만 확인
  # 예: [eth0, 192.168.1.1]  → IP 존재 및 NIC 일치 확인
  #     [eth0, ""]            → eth0 인터페이스 UP 여부만 확인
  NIC_CHECKS: []

  # Task 5: LiDAR 설정 (lidar_configurator.py에 넘길 설정 파일 경로)
  # 절대 경로 또는 config.yml 기준 상대 경로
  # null 이면 task 비활성화
  LIDAR_CONFIG_FILE: null

# =============================================================================
# 프로파일별 오버라이드 (DEFAULT에서 변경할 키만 작성)
# =============================================================================
profiles:

  odim:
    ENABLED:
      install_logrotate: false   # odim은 logrotate 설치 불필요
    CAN_CMD_TEMPLATE: >-
      ip link set {iface} up type can bitrate 500000 sjw 3 sample-point 0.8
      berr-reporting on restart-ms 100
    NIC_CHECKS:
      - [eth0,    "192.168.31.6"]
      - [veth0,   "192.168.0.6"]
      - [veth0.2, "192.168.9.101"]
      - [can0,    ""]
      - [can1,    ""]

  odil:
    ENABLED:
      run_lidar_config: true
    LIDAR_CONFIG_FILE: v14_lidar_config.yaml
    NIC_CHECKS:
      - [eth0,     "192.168.31.7"]
      - [veth0,    "192.168.0.7"]
      - [veth0.2,  "192.168.9.102"]
      - [veth0.19, "10.13.1.166"]
      - [veth0.30, "10.30.1.206"]
      - [veth0.31, "10.31.1.206"]
      - [veth0.34, "10.34.1.206"]
      - [veth0.35, "10.35.1.206"]
      - [veth0.36, "10.36.1.206"]
      - [veth0.37, "10.37.1.206"]
      - [can0,     ""]
      - [can1,     ""]
    PING_TARGETS:
      - 10.13.1.113


  odic:
    ENABLED:
      run_lidar_config: true
    LIDAR_CONFIG_FILE: v14_lidar_config.yaml
    NIC_CHECKS:
      - [eth0,     "192.168.31.8"]
      - [veth0,    "192.168.0.8"]
      - [veth0.2,  "192.168.9.103"]
      - [veth0.30, "10.30.1.206"]
      - [veth0.31, "10.31.1.206"]
      - [veth0.34, "10.34.1.206"]
      - [veth0.35, "10.35.1.206"]
      - [veth0.36, "10.36.1.206"]
      - [veth0.37, "10.37.1.206"]
      - [can0,     ""]
      - [can1,     ""]
